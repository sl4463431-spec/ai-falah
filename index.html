<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI الفلاح</title>
<style>body{font-family:system-ui;background:#f1f5f2;margin:0;padding:20px} .top{background:linear-gradient(135deg,#052e16,#16a34a);color:#fff;padding:22px;border-radius:20px;text-align:center} .top h1{margin:0} button{width:100%;padding:16px;margin:10px 0 0;border:0;border-radius:14px;font-size:18px;font-weight:bold;color:#fff;cursor:pointer} #b1{background:#dc2626}#b2{background:#0284c7}#b3{background:#16a34a} #res{background:#fff;padding:16px;border-radius:14px;margin-top:14px;font-size:17px;line-height:1.7}</style>
</head>
<body>
<div class="top"><h1>🤖 AI الفلاح</h1><p>المشروع الجديد - كل حاجة شغالة</p></div>
<button id="b1">🩺 مرض عندي</button>
<button id="b2">💰 احسب مكسبي</button>
<button id="b3">🏆 أنجح محصولي</button>
<div id="res">دوس على أي زرار فوق 👆</div>
<script>
document.getElementById("b1").addEventListener("click", function(){ document.getElementById("res").innerText = "✅ زرار المرض شغال! صدأ القمح: رش تيلت كل 15 يوم."; });
document.getElementById("b2").addEventListener("click", function(){ document.getElementById("res").innerText = "✅ زرار المكسب شغال! بصل - 1 فدان = مكسب 120,000 جنيه 💰"; });
document.getElementById("b3").addEventListener("click", function(){ document.getElementById("res").innerText = "✅ زرار النجاح شغال! ازرع في ميعاده واسقي الصبح بدري 🏆"; });
</script>
</body>
</html>
